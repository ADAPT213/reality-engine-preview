name: PRO preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ADAPT213/reality-engine
          ref: 5f04c04981da4325e4362363a6b4a92fce6b42ce
          path: source
      - run: |
          test "$(git -C source rev-parse HEAD)" = 5f04c04981da4325e4362363a6b4a92fce6b42ce
          mkdir public
          cp -a source/candidate-pro/. public/
          cp source/LICENSE public/ 2>/dev/null || true
          git -C source rev-parse HEAD > public/source-sha.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deploy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - env:
          PREVIEW_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const url=process.env.PREVIEW_URL.replace(/\/$/,'')+'/';
          const browser=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--use-fake-device-for-media-stream','--use-fake-ui-for-media-stream']});
          try {
            const page=await browser.newPage({permissions:['camera'],viewport:{width:390,height:844}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('response',r=>{if(r.status()>=400)errors.push(r.url()+': '+r.status())});
            const sha=await page.request.get(url+'source-sha.txt');if((await sha.text()).trim()!=='5f04c04981da4325e4362363a6b4a92fce6b42ce')throw Error('SHA mismatch');
            await page.goto(url+'?validate=1');
            if(await page.locator('#mode option').count()!==14)throw Error('Lens inventory mismatch');
            await page.locator('#start').click();
            await page.waitForFunction(()=>window.proFrame?.frame>2,{},{timeout:30000});
            for(let i=0;i<14;i++){await page.locator('#mode').evaluate((el,i)=>{el.selectedIndex=i;el.dispatchEvent(new Event('change'))},i);await page.waitForFunction(i=>window.proFrame?.route===i,i,{timeout:15000});}
            if(errors.length)throw Error(errors.join('\n'));
            console.log('Deployed preview passed: '+url);
          }finally{await browser.close()}
          JS
